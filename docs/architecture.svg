<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="275" viewBox="0 0 1000 275" role="img" aria-labelledby="title desc"><title id="title">Bounded histogram pipeline</title><desc id="desc">Rust and C implement the same contract. Python checks containment independently.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#9c3b13"/></marker></defs><rect width="1000" height="275" fill="#f1f2ef"/><g font-family="Verdana, sans-serif"><text x="25" y="44" font-size="24" fill="#152f40">Bounded histogram pipeline</text><rect x="25" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="40" y="135" font-size="18" fill="#152f40">Integer samples</text><text x="40" y="165" font-size="13" fill="#3f4e57">One unsigned ns value/line</text><path d="M234 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="280" y="135" font-size="18" fill="#152f40">65 counters</text><text x="280" y="165" font-size="13" fill="#3f4e57">Bit-width bucket selection</text><path d="M474 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="520" y="135" font-size="18" fill="#152f40">Nearest-rank query</text><text x="520" y="165" font-size="13" fill="#3f4e57">Scan counts, clamp bounds</text><path d="M714 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="745" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="760" y="135" font-size="18" fill="#152f40">Independent oracle</text><text x="760" y="165" font-size="13" fill="#3f4e57">Sorted exact-rank checks</text><text x="25" y="248" font-size="13" fill="#3f4e57">Rust and C implement the same contract. Python checks containment independently.</text></g></svg>
