<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">Latency Atlas histogram and Rust C API</title>
  <desc id="desc">The same sample stream is checked against Rust and C histogram results. A C caller can reach the Rust histogram through an opaque handle, and the Python oracle checks exact ranks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="#536a7d" />
    </marker>
  </defs>

  <rect width="1100" height="580" fill="#f8fafc" />
  <g font-family="Consolas, Liberation Mono, monospace" fill="#101820">
    <text x="30" y="45" font-size="25" font-weight="bold">LATENCY ATLAS / NUMERICAL CONTRACT</text>
    <text x="30" y="76" font-size="16" fill="#536a7d">same histogram rules in Rust and C; C can call the Rust implementation</text>

    <rect x="30" y="105" width="1040" height="55" fill="#eaf0f4" stroke="#8ca1b0" />
    <text x="50" y="140" font-size="22">samples:  0  1  2  4  8  16  32  100  (nanoseconds)</text>

    <text x="35" y="211" font-size="17" font-weight="bold">RUST AND C USE THE SAME 65-BUCKET CONTRACT</text>

    <g fill="#fff" stroke="#8ca1b0">
      <rect x="35" y="231" width="58" height="65" />
      <rect x="99" y="231" width="58" height="65" />
      <rect x="163" y="231" width="58" height="65" />
      <rect x="227" y="231" width="58" height="65" />
      <rect x="291" y="231" width="58" height="65" />
      <rect x="355" y="231" width="58" height="65" />
      <rect x="419" y="231" width="58" height="65" />
      <rect x="483" y="231" width="58" height="65" />
      <rect x="547" y="231" width="58" height="65" />
      <rect x="611" y="231" width="58" height="65" />
    </g>
    <g font-size="13" fill="#536a7d" text-anchor="middle">
      <text x="64" y="254">0</text>
      <text x="128" y="254">1</text>
      <text x="192" y="254">2</text>
      <text x="256" y="254">3</text>
      <text x="320" y="254">4</text>
      <text x="384" y="254">5</text>
      <text x="448" y="254">6</text>
      <text x="512" y="254">7</text>
      <text x="576" y="254">...</text>
      <text x="640" y="254">64</text>
    </g>
    <g font-size="22" text-anchor="middle">
      <text x="64" y="282">1</text>
      <text x="128" y="282">1</text>
      <text x="192" y="282">1</text>
      <text x="256" y="282">1</text>
      <text x="320" y="282">1</text>
      <text x="384" y="282">1</text>
      <text x="448" y="282">1</text>
      <text x="512" y="282">1</text>
      <text x="576" y="282">0</text>
      <text x="640" y="282">0</text>
    </g>

    <path d="M705 263 H760" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="780" y="220" width="285" height="95" fill="#101820" />
    <g font-size="20" fill="#fff">
      <text x="795" y="248">p50: [4, 7]</text>
      <text x="795" y="275">p95: [64, 100]</text>
      <text x="795" y="301">p99: [64, 100]</text>
    </g>

    <path d="M160 160 V185 H25 V380 H60" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="60" y="350" width="650" height="75" fill="#eaf0f4" stroke="#8ca1b0" />
    <text x="80" y="378" font-size="17" font-weight="bold">PYTHON ORACLE: SORT SAMPLES AND SELECT EXACT RANKS</text>
    <text x="80" y="404" font-size="17">p50 = 4; p95 = 100; p99 = 100</text>
    <path d="M710 388 H920 V317" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)" />
    <text x="770" y="420" font-size="16" fill="#536a7d">checks exact ranks against bounds</text>

    <text x="30" y="451" font-size="17" font-weight="bold">C CALLS THE RUST IMPLEMENTATION THROUGH ITS C API</text>
    <g fill="#fff" stroke="#8ca1b0">
      <rect x="60" y="465" width="270" height="65" />
      <rect x="415" y="465" width="285" height="65" />
      <rect x="785" y="465" width="285" height="65" />
    </g>
    <g text-anchor="middle">
      <text x="195" y="490" font-size="16" font-weight="bold">C CALLER</text>
      <text x="195" y="515" font-size="13" fill="#536a7d">includes rust_histogram.h</text>
      <text x="557" y="490" font-size="16" font-weight="bold">OPAQUE HANDLE API</text>
      <text x="557" y="515" font-size="13" fill="#536a7d">create · record · merge · query</text>
      <text x="927" y="490" font-size="16" font-weight="bold">RUST HISTOGRAM</text>
      <text x="927" y="515" font-size="13" fill="#536a7d">Rust owns the histogram state</text>
    </g>
    <path d="M330 497 H400" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M700 497 H770" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)" />

    <text x="30" y="562" font-size="15" fill="#536a7d">Reported percentiles are inclusive bounds, not exact values.</text>
  </g>
</svg>
