<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Latency Atlas example and independent oracle</title><desc id="desc">An eight-sample stream maps to histogram counters and percentile ranges. An independent sorted-rank calculation checks that the ranges contain the exact answers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#536a7d"/></marker></defs>
<rect width="1100" height="500" fill="#f8fafc"/><g font-family="Consolas, Liberation Mono, monospace" fill="#101820" color="#101820"><text x="30" y="45" font-size="25" fill="#101820" font-weight="bold" text-anchor="start">LATENCY ATLAS / NUMERICAL CONTRACT</text><text x="30" y="76" font-size="16" fill="#536a7d" font-weight="normal" text-anchor="start">same samples, independent calculations</text><rect x="30" y="105" width="1040" height="55" fill="#eaf0f4" stroke="#8ca1b0" stroke-dasharray=""/><text x="50" y="140" font-size="22" fill="currentColor" font-weight="normal" text-anchor="start">samples:  0  1  2  4  8  16  32  100  (nanoseconds)</text><text x="35" y="211" font-size="17" fill="#101820" font-weight="bold" text-anchor="start">RUST + C: STREAM INTO 65 COUNTERS</text><rect x="35" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="64" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">0</text><text x="64" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="99" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="128" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">1</text><text x="128" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="163" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="192" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">2</text><text x="192" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="227" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="256" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">3</text><text x="256" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="291" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="320" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">4</text><text x="320" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="355" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="384" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">5</text><text x="384" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="419" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="448" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">6</text><text x="448" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="483" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="512" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">7</text><text x="512" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">1</text><rect x="547" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="576" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">...</text><text x="576" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">0</text><rect x="611" y="231" width="58" height="65" fill="#fff" stroke="#8ca1b0" stroke-dasharray=""/><text x="640" y="254" font-size="13" fill="#536a7d" font-weight="normal" text-anchor="middle">64</text><text x="640" y="282" font-size="22" fill="currentColor" font-weight="normal" text-anchor="middle">0</text><path d="M705 263 H760" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="220" width="285" height="95" fill="#101820" stroke="none" stroke-dasharray=""/><text x="795" y="248" font-size="20" fill="#fff" font-weight="normal" text-anchor="start">p50: [4, 7]</text><text x="795" y="275" font-size="20" fill="#fff" font-weight="normal" text-anchor="start">p95: [64, 100]</text><text x="795" y="301" font-size="20" fill="#fff" font-weight="normal" text-anchor="start">p99: [64, 100]</text><path d="M160 160 V185 H25 V380 H60" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="350" width="650" height="75" fill="#eaf0f4" stroke="#8ca1b0" stroke-dasharray=""/><text x="80" y="378" font-size="17" fill="#101820" font-weight="bold" text-anchor="start">PYTHON ORACLE: sort samples and select exact ranks</text><text x="80" y="404" font-size="17" fill="#101820" font-weight="normal" text-anchor="start">p50 = 4; p95 = 100; p99 = 100</text><path d="M710 388 H920 V317" fill="none" stroke="#536a7d" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="420" font-size="16" fill="#536a7d" font-weight="normal" text-anchor="start">check containment</text><text x="30" y="468" font-size="16" fill="#101820" font-weight="normal" text-anchor="start">Reported percentiles are inclusive bounds. Agreement between Rust and C is not the only check.</text></g></svg>
